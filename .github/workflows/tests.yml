name: Tests

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update && sudo apt install -y --no-install-recommends python3-pip
        pip3 install --upgrade pip
        # setuptools <69 required for metadata compatibility with twine
        pip3 install 'setuptools<69' wheel twine

    - name: Build package
      run: python3 setup.py sdist bdist_wheel

    - name: Twine check
      run: python3 -m twine check dist/*

  lint-python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update && sudo apt install -y --no-install-recommends python3-setuptools
        pip3 install --upgrade setuptools
        pip3 install flake8 black

    - name: Lint Python
      run: python3 -m flake8 canonicalwebteam tests setup.py && python3 -m black --line-length 79 --check canonicalwebteam tests setup.py

  test-python:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update && sudo apt install -y --no-install-recommends python3-setuptools python3-pip
        pip3 install --upgrade setuptools
        pip3 install wheel

    - name: Install package and test dependencies
      run: |
        pip3 install -e .
        pip3 install vcrpy-unittest

    - name: Test Python
      run: python3 -m unittest discover -s tests -p "test_*.py"

  check-inclusive-naming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inclusive naming
        uses: canonical-web-and-design/inclusive-naming@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail-on-error: true
